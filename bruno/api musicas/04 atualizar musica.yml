info:
  name: 04 atualizar musica
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/musicas/{{idCriado}}"
  body:
    type: json
    data: |-
      {
        "titulo": "Master of Puppets (Remastered)",
        "artista": "Metallica",
        "album": "Master of Puppets",
        "genero": "Thrash Metal",
        "ano": 1986
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
