info:
  name: 06 excluir musica
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{baseUrl}}/api/musicas/{{idCriado}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
