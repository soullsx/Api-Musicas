info:
  name: 07 buscar musica excluida (404)
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/musicas/{{idCriado}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
