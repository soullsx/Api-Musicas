info:
  name: 09 buscar depois de reiniciar a API
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/musicas/{{idPersistencia}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
